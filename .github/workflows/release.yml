name: Release to PyPI

# Publishes umbra-scan to PyPI whenever you push a version tag (e.g. v0.1.1),
# using PyPI Trusted Publishing (OIDC) — no API tokens stored in the repo.
#
# ONE-TIME SETUP on PyPI (https://pypi.org/manage/project/umbra-scan/settings/publishing/):
#   Add a "Trusted Publisher":
#     Owner:           eliem08
#     Repository:      umbra
#     Workflow name:   release.yml
#     Environment:     pypi
# After that, `git tag vX.Y.Z && git push origin vX.Y.Z` ships the release.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
