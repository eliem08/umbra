# Allows other repos to use Umbra as a pre-commit hook:
#
#   - repo: https://github.com/eliem08/umbra
#     rev: v0.1.0
#     hooks:
#       - id: shadow-scan
#         args: ["--path", ".", "--openapi", "openapi.json", "--strict"]
#
# (override `args` to point at your codebase and OpenAPI spec).
- id: shadow-scan
  name: Umbra Shadow API Scanner
  description: Block commits that introduce undocumented or unauthenticated endpoints.
  entry: shadow-scan
  language: python
  pass_filenames: false
  always_run: true
