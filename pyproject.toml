[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umbra-scan"
version = "0.1.6"
description = "Umbra — hunt shadow APIs and missing auth across FastAPI, Flask, Spring Boot, and Express"
readme = "README.md"
requires-python = ">=3.11"
license = "Elastic-2.0"
authors = [
    { name = "eliem08" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["security", "devsecops", "api", "shadow-api", "fastapi", "flask", "spring", "express", "sarif", "mcp"]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "mcp>=0.1.0",
    "fastmcp>=0.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "flask>=2.3.0",
    "uvicorn>=0.22.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
# x402 micropayment gate for the MCP server (official SDK). Needs both the
# FastAPI middleware and the EVM mechanism (Base/eip155 -> eth_abi/eth_account).
x402 = [
    "x402[fastapi,evm]"
]

[project.scripts]
umbra = "umbra.cli.main:main"
shadow-scan = "umbra.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["umbra*"]

[tool.setuptools.package-data]
"umbra.engine.runtime" = ["*.js"]
